name: Nightly SEA Build

on:
  schedule:
    # 北京时间每天 0 点（UTC 16:00）。若需要 UTC 0 点，改成 "0 0 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-sea-build
  cancel-in-progress: false

env:
  # 与 mise.toml 中锁定的工具链保持一致
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.33.2"
  # 本工作流只产出 CLI 可执行程序，跳过 Electron 二进制下载以缩短安装时间
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  HUSKY: "0"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            targets: linux-x64,linux-arm64
            artifact: zcode-linux
          # macOS 目标必须在 macOS runner 上构建，否则缺少 ad-hoc 签名无法运行
          - os: macos-latest
            name: macos
            targets: darwin-arm64,darwin-x64
            artifact: zcode-darwin
          - os: windows-latest
            name: windows
            targets: win-x64,win-arm64
            artifact: zcode-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 与 apps/zcode-cli/packages/cli 的 build:sea 等价，只是把最后的 --all 换成按 runner 拆分的 targets
      # SEA 资产的 TUI 运行时闭包会经 @zcode/contracts 依赖仓库根的 @zcode/shared，
      # 缺少根 workspace 的 dist 会在 build-sea 阶段报 "Missing @zcode/shared dist files"。
      - name: Build root workspace packages
        run: |
          pnpm -r --filter "./packages/*" --filter "!@zcode/desktop" build

      # @zcode/contracts 依赖 @zcode/shared，而后者只导出 src 且没有 build 脚本；
      # SEA 运行时闭包要求 workspace 包带 dist/index.js，这里用其 tsconfig 显式编译。
      - name: Build @zcode/shared
        run: pnpm exec tsc -b packages/shared

      - name: Build workspace bundles
        run: pnpm exec turbo --skip-infer --cwd apps/zcode-cli run build --filter '!@zcode/cli' --force

      - name: Build CLI bundle
        run: pnpm --dir apps/zcode-cli/packages/cli run build

      - name: Build SEA binaries (${{ matrix.targets }})
        run: node apps/zcode-cli/packages/cli/scripts/build-sea.mjs --targets ${{ matrix.targets }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.run_number }}
          # 明确列出文件名：通配 zcode-* 会把 *.sea.blob 中间产物一起带上
          path: |
            apps/zcode-cli/packages/cli/dist/zcode-linux-x64
            apps/zcode-cli/packages/cli/dist/zcode-linux-arm64
            apps/zcode-cli/packages/cli/dist/zcode-darwin-arm64
            apps/zcode-cli/packages/cli/dist/zcode-darwin-x64
            apps/zcode-cli/packages/cli/dist/zcode-windows-x64.exe
            apps/zcode-cli/packages/cli/dist/zcode-windows-arm64.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish nightly release
    needs: build
    # 某个平台构建失败时仍发布其余已成功的产物
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: zcode-*
          path: dist
          merge-multiple: true

      # release asset 不保留可执行位，这里显式恢复
      - name: Restore executable bits
        run: |
          chmod +x dist/zcode-linux-x64 dist/zcode-linux-arm64 dist/zcode-darwin-arm64 dist/zcode-darwin-x64 || true
          ls -lh dist

      - name: Compose release notes
        id: notes
        run: |
          echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          {
            echo "ZCode CLI nightly build（单文件可执行程序）。"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- 构建时间: $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "- 平台: linux x64/arm64、macOS x64/arm64、Windows x64/arm64"
            echo
            echo "Linux/macOS 下载后执行 \`chmod +x zcode-*\`；macOS 产物已 ad-hoc 签名。"
          } > release-notes.md

      # 固定 tag `nightly`，每次运行更新同一个预发布版本并覆盖同名资产
      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly ${{ steps.notes.outputs.date }} (#${{ github.run_number }})
          body_path: release-notes.md
          prerelease: true
          make_latest: false
          # 部分平台构建失败时仍发布其余产物
          fail_on_unmatched_files: false
          files: |
            dist/zcode-linux-x64
            dist/zcode-linux-arm64
            dist/zcode-darwin-arm64
            dist/zcode-darwin-x64
            dist/zcode-windows-x64.exe
            dist/zcode-windows-arm64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
